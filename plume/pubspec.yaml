name: plume
description: "Plume: a premium shopping app for Shorebird release and patch demos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_ui: ^1.1.7
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  shorebird_code_push: ^2.0.7

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
