name: ci

on:
  pull_request:
    branches:
      - main
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]

jobs:
  semantic_pull_request:
    name: ✅ Semantic Pull Request
    # No pull request to read the title of on a merge_group event. A skipped
    # job is not a failure, so the ci gate still reports.
    if: ${{ github.event_name == 'pull_request' }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v2

  changes:
    runs-on: ubuntu-latest

    outputs:
      needs_flutter_build: ${{ steps.needs_flutter_build.outputs.changes }}

    name: 👀 Detect Changes

    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dorny/paths-filter@v4
        name: Build Detection
        id: needs_flutter_build
        with:
          filters: |
            flavors:
              - ./.github/workflows/main.yaml
              - ./.github/actions/dart_package
              - flavors/**

  build_flutter_apps:
    needs: changes
    if: ${{ needs.changes.outputs.needs_flutter_build != '[]' }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_flutter_build) }}

    runs-on: ubuntu-latest

    name: 🎯 Build ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 🐦 Build ${{ matrix.package }}
        uses: ./.github/actions/flutter_app
        with:
          coverage_excludes: "**/*.g.dart"
          working_directory: ${{ matrix.package }}

  ci:
    needs: [semantic_pull_request, build_flutter_apps]
    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: ⛔️ exit(1) on failure
        if: ${{ contains(join(needs.*.result, ','), 'failure') }}
        run: exit 1
