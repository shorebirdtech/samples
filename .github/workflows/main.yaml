name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      needs_flutter_build: ${{ steps.needs_flutter_build.outputs.changes }}

    name: 👀 Detect Changes

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Build Detection
        id: needs_flutter_build
        with:
          filters: |
            flavors:
              - ./.github/workflows/main.yaml
              - ./.github/actions/dart_package
              - flavors/**

  build_flutter_apps:
    needs: changes
    if: ${{ needs.changes.outputs.needs_flutter_build != '[]' }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_flutter_build) }}

    runs-on: ubuntu-latest

    name: 🎯 Build ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: 🐦 Build ${{ matrix.package }}
        uses: ./.github/actions/flutter_app
        with:
          coverage_excludes: "**/*.g.dart"
          working_directory: ${{ matrix.package }}

  ci:
    needs: [changes, build_flutter_apps]
    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      # A job that hits its timeout-minutes (or loses its runner) ends
      # 'cancelled', not 'failure', so checking 'failure' alone leaves ci
      # green. Fail on 'cancelled' too, unless the whole run was cancelled
      # (cancelled by hand), where ci doesn't matter.
      - name: ⛔️ exit(1) on failure
        if: >-
          ${{
            contains(join(needs.*.result, ','), 'failure') ||
            (!cancelled() && contains(join(needs.*.result, ','), 'cancelled'))
          }}
        run: exit 1
