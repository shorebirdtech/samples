name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      needs_flutter_build: ${{ steps.needs_flutter_build.outputs.changes }}
      fastlane_demo_ios: ${{ steps.fastlane.outputs.fastlane_demo_ios }}

    name: 👀 Detect Changes

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Build Detection
        id: needs_flutter_build
        with:
          filters: |
            flavors:
              - ./.github/workflows/main.yaml
              - ./.github/actions/flutter_app/**
              - ./.github/actions/setup_flutter/**
              - flavors/**

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Fastlane Detection
        id: fastlane
        with:
          filters: |
            fastlane_demo_ios:
              - ./.github/workflows/main.yaml
              - fastlane_demo/ios/**
              # The dry run reads the version from pubspec.yaml.
              - fastlane_demo/pubspec.yaml
              - .github/scripts/dry_run_fastfile.rb

  build_flutter_apps:
    needs: changes
    if: ${{ needs.changes.outputs.needs_flutter_build != '[]' }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_flutter_build) }}

    runs-on: ubuntu-latest

    name: 🎯 Build ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: 🐦 Build ${{ matrix.package }}
        uses: ./.github/actions/flutter_app
        with:
          coverage_excludes: "**/*.g.dart"
          working_directory: ${{ matrix.package }}

  # Checks fastlane_demo's Ruby/fastlane setup. Lives here, not in the
  # generated shorebird_ci.yaml, because shorebird_ci verify rejects hand edits.
  fastlane_demo_fastlane:
    needs: changes
    if: needs.changes.outputs.fastlane_demo_ios == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastlane_demo/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: fastlane_demo/ios

      # Run every lane with its actions validated but skipped.
      - name: Dry-run the lanes
        # Placeholders for the variables .env.default.sample documents, so
        # required options that come from them count as set. The API key is
        # CI-only and the Apple ID login local-only, so each dry-run pass
        # unsets the other's.
        env:
          MATCH_PASSWORD: dry-run
          FASTLANE_USER: dry-run@example.com
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: dry-run
          APP_STORE_CONNECT_API_KEY_KEY_ID: dry-run
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: dry-run
          APP_STORE_CONNECT_API_KEY_KEY: ZHJ5LXJ1bg==
          DRY_RUN_CI_ONLY_ENV: >-
            APP_STORE_CONNECT_API_KEY_KEY_ID,APP_STORE_CONNECT_API_KEY_ISSUER_ID,APP_STORE_CONNECT_API_KEY_KEY
          DRY_RUN_LOCAL_ONLY_ENV: FASTLANE_USER,FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD
        run: >-
          bundle exec ruby ../../.github/scripts/dry_run_fastfile.rb fastlane/Fastfile
          patch_shorebird release_version=1.0.0+11

  ci:
    needs: [changes, build_flutter_apps, fastlane_demo_fastlane]
    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      # A job that hits its timeout-minutes (or loses its runner) ends
      # 'cancelled', not 'failure', so checking 'failure' alone leaves ci
      # green. Fail on 'cancelled' too, unless the whole run was cancelled
      # (cancelled by hand), where ci doesn't matter.
      - name: ⛔️ exit(1) on failure
        if: >-
          ${{
            contains(join(needs.*.result, ','), 'failure') ||
            (!cancelled() && contains(join(needs.*.result, ','), 'cancelled'))
          }}
        run: exit 1
