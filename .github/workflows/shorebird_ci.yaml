# Generated by shorebird_ci --style static. Hand edits are reverted.
# Run `shorebird_ci verify` to check this file against the repository.
name: Shorebird CI

# A new push to a PR cancels that PR's run still going on the older head.
# Other events (push to main, merge_group) group by run id, so they never
# cancel or queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's changed files through the API.
      pull-requests: read
    outputs:
      clear_skies: ${{ steps.filter.outputs.clear_skies }}
      fastlane_demo: ${{ steps.filter.outputs.fastlane_demo }}
      flavors: ${{ steps.filter.outputs.flavors }}
      multi_dimensioanl_flavors: ${{ steps.filter.outputs.multi_dimensioanl_flavors }}
      my_flutter_module: ${{ steps.filter.outputs.my_flutter_module }}
      progressive_rollout_demo: ${{ steps.filter.outputs.progressive_rollout_demo }}
      shorebird_fintech_wallet: ${{ steps.filter.outputs.shorebird_fintech_wallet }}
      shorebird_runner: ${{ steps.filter.outputs.shorebird_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so dorny/paths-filter can diff on push events.
          fetch-depth: 0
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub global activate shorebird_ci 0.3.3
      - name: Verify CI coverage
        run: shorebird_ci verify
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event.merge_group.base_ref || '' }}
          filters: |
            clear_skies:
              - .github/workflows/_shorebird_ci_flutter.yaml
              - .github/workflows/shorebird_ci.yaml
              - clear_skies/**
            fastlane_demo:
              - .github/workflows/_shorebird_ci_flutter.yaml
              - .github/workflows/shorebird_ci.yaml
              - fastlane_demo/**
            flavors:
              - .github/workflows/_shorebird_ci_flutter.yaml
              - .github/workflows/shorebird_ci.yaml
              - flavors/**
            multi_dimensioanl_flavors:
              - .github/workflows/_shorebird_ci_flutter.yaml
              - .github/workflows/shorebird_ci.yaml
              - multi_dimensional_flavors/**
            my_flutter_module:
              - .github/workflows/_shorebird_ci_flutter.yaml
              - .github/workflows/shorebird_ci.yaml
              - add_to_app/my_flutter_module/**
            progressive_rollout_demo:
              - .github/workflows/_shorebird_ci_flutter.yaml
              - .github/workflows/shorebird_ci.yaml
              - progressive_rollout_demo/**
            shorebird_fintech_wallet:
              - .github/workflows/_shorebird_ci_flutter.yaml
              - .github/workflows/shorebird_ci.yaml
              - shorebird_fintech_wallet/**
            shorebird_runner:
              - .github/workflows/_shorebird_ci_flutter.yaml
              - .github/workflows/shorebird_ci.yaml
              - shorebird_runner/**

  clear_skies:
    needs: changes
    if: needs.changes.outputs.clear_skies == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: clear_skies
      package_path: clear_skies
      has_unit_tests: true
      subpackages: ""
      flutter_version: ""
      has_integration_tests: false

  fastlane_demo:
    needs: changes
    if: needs.changes.outputs.fastlane_demo == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: fastlane_demo
      package_path: fastlane_demo
      has_unit_tests: true
      subpackages: ""
      flutter_version: ""
      has_integration_tests: false

  flavors:
    needs: changes
    if: needs.changes.outputs.flavors == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: flavors
      package_path: flavors
      has_unit_tests: true
      subpackages: ""
      flutter_version: ""
      has_integration_tests: false

  multi_dimensioanl_flavors:
    needs: changes
    if: needs.changes.outputs.multi_dimensioanl_flavors == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: multi_dimensioanl_flavors
      package_path: multi_dimensional_flavors
      has_unit_tests: true
      subpackages: ""
      flutter_version: ""
      has_integration_tests: false

  my_flutter_module:
    needs: changes
    if: needs.changes.outputs.my_flutter_module == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: my_flutter_module
      package_path: add_to_app/my_flutter_module
      has_unit_tests: true
      subpackages: ""
      flutter_version: ""
      has_integration_tests: false

  progressive_rollout_demo:
    needs: changes
    if: needs.changes.outputs.progressive_rollout_demo == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: progressive_rollout_demo
      package_path: progressive_rollout_demo
      has_unit_tests: true
      subpackages: ""
      flutter_version: ""
      has_integration_tests: false

  shorebird_fintech_wallet:
    needs: changes
    if: needs.changes.outputs.shorebird_fintech_wallet == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: shorebird_fintech_wallet
      package_path: shorebird_fintech_wallet
      has_unit_tests: true
      subpackages: ""
      flutter_version: ""
      has_integration_tests: true

  shorebird_runner:
    needs: changes
    if: needs.changes.outputs.shorebird_runner == 'true'
    uses: ./.github/workflows/_shorebird_ci_flutter.yaml
    with:
      package_name: shorebird_runner
      package_path: shorebird_runner
      has_unit_tests: true
      subpackages: ""
      flutter_version: ""
      has_integration_tests: false

  required:
    name: required
    if: ${{ !cancelled() }}
    needs:
      - changes
      - clear_skies
      - fastlane_demo
      - flavors
      - multi_dimensioanl_flavors
      - my_flutter_module
      - progressive_rollout_demo
      - shorebird_fintech_wallet
      - shorebird_runner
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were skipped because nothing changed)."

