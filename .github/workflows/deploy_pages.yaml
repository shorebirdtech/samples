name: Deploy Shorebird Runner to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'shorebird_runner/**'
      - '.github/workflows/deploy_pages.yaml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}patch-runner/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: shorebird_runner
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: shorebird_runner
        run: |
          BASE_HREF="${{ steps.pages.outputs.base_path }}/patch-runner/"
          echo "Building for base href: $BASE_HREF"
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}"

      - name: Prepare Pages Artifact
        run: |
          mkdir -p dist/patch-runner
          cp -r shorebird_runner/build/web/* dist/patch-runner/
          cat <<'EOF' > dist/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=patch-runner/">
            <script>window.location.href = "patch-runner/";</script>
            <title>Shorebird Samples - Patch Runner</title>
          </head>
          <body>
            <p>Redirecting to <a href="patch-runner/">Patch Runner</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
